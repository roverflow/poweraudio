# poweraudio configuration
#
# Lives at ~/.config/poweraudio/config.toml and is written on first run.
# The daemon reads it at startup. Restart it after editing by hand:
#   systemctl --user restart poweraudio
#
# Saving from the terminal UI rewrites this file from the daemon's in-memory
# config, which drops any comments you added.

[general]
# "auto" tries wpctl first, then pactl.
backend = "auto"

# Accepted but not used yet. The daemon logs at a fixed level to stderr.
log_level = "info"

[switching]
# What a Bluetooth device connecting is allowed to do:
#   "always"   take the output every time
#   "priority" take it only when it outranks whatever is playing
#   "never"    log the event, change nothing
on_connect = "always"

# Where the output goes when the device you were listening on disappears:
#   "priority" the highest ranked entry below that is present
#   "previous" whatever was default before the daemon switched away
on_disconnect = "priority"

# Head start given to PipeWire to register the new sink before the daemon
# goes looking for it. Missing sinks are retried for 15 seconds regardless.
switch_delay_ms = 500

[notifications]
# Desktop notifications through notify-send.
enabled = true

# Notify when something other than the daemon changes the default device.
on_device_change = true

[daemon]
# Defaults to $XDG_RUNTIME_DIR/poweraudio.sock, created with mode 0600.
# socket_path = "/run/user/1000/poweraudio.sock"

[tui]
# Accepted but not used yet. Volume bars are always drawn.
show_volume = true

# Fallback ranking, highest first. An entry matches a device when "match" is a
# case-insensitive substring of its name, description or MAC address. Setting
# "type" additionally requires the detected type to match: bluetooth, speaker,
# headphone, hdmi, usb or unknown.
#
# [[priority]]
# match = "JBL Tune 520BT"
# type = "bluetooth"
#
# [[priority]]
# match = "Built-in Audio Analog Stereo"
