# poweraudio configuration, read from ~/.config/poweraudio/config.toml.
# The daemon reloads it when it changes. Saving from the UI drops comments.

[general]
# Kept for older configs. Every value does the same thing.
backend = "auto"

# Lowest level logged to stderr: debug, info, warn or error.
log_level = "info"

# Optional. Also append log lines to this file.
# log_file = "/home/you/.local/state/poweraudio/daemon.log"

[switching]
# When a Bluetooth device connects:
#   "always"   switch to it every time
#   "priority" switch to it only if it ranks above what is playing now
#   "never"    log the event and change nothing
on_connect = "always"

# When the output you were using disappears:
#   "priority" the highest ranked entry below that is still present
#   "previous" whatever was the default before the daemon switched away
on_disconnect = "priority"

# Milliseconds to wait for PipeWire to add the new sink before looking.
switch_delay_ms = 500

[notifications]
# Show desktop notifications over D-Bus: true or false.
enabled = true

# Notify when something else changes the default output: true or false.
on_device_change = true

[daemon]
# Defaults to $XDG_RUNTIME_DIR/poweraudio.sock.
# socket_path = "/run/user/1000/poweraudio.sock"

[tui]
# Accepted but not used yet.
show_volume = true

# Fallback ranking, highest first. "match" is a case-insensitive substring
# of the name, description or MAC address. "type" is optional: bluetooth,
# speaker, headphone, hdmi, usb or unknown.
#
# [[priority]]
# match = "JBL Tune 520BT"
# type = "bluetooth"
#
# [[priority]]
# match = "Built-in Audio Analog Stereo"
